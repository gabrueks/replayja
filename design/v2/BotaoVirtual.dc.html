<script data-dc-script data-props='{"marca":{"editor":"color","default":"#FF6B1F","options":["#FF6B1F","#0A7A3D","#3B7BFF","#FF3D6E"],"section":"Marca"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const marca = this.props.marca ?? '#FF6B1F';
    const h = String(marca).replace('#', '');
    const n = h.length === 3 ? h.split('').map(function (c) { return c + c; }).join('') : h;
    const p = (n.match(/../g) || ['D9', '3C', '06']).map(function (x) { return parseInt(x, 16); });
    const r = p[0], g = p[1], b = p[2];
    const a = function (o) { return 'rgba(' + r + ',' + g + ',' + b + ',' + o + ')'; };
    const mix = function (t) {
      return 'rgb(' + [r, g, b].map(function (c) {
        return Math.round(t > 0 ? c + (255 - c) * t : c * (1 + t));
      }).join(',') + ')';
    };
    return {
      marca: marca,
      brilhoP: '0 4px 10px -3px ' + a('.5'),
      brilho: '0 10px 22px -10px ' + a('.65'),
      auraBanda: 'radial-gradient(ellipse at 50% 40%, ' + a('.3') + ' 0%, ' + a('0') + ' 64%)',
      auraTela: 'radial-gradient(ellipse at 50% 44%, ' + a('.3') + ' 0%, ' + a('0') + ' 66%)',
      auraCanto: 'radial-gradient(circle, ' + a('.24') + ' 0%, ' + a('0') + ' 68%)',
      auraFundo: 'radial-gradient(ellipse at 50% 46%, ' + a('.32') + ' 0%, ' + a('.10') + ' 38%, ' + a('0') + ' 66%)',
      anelForte: '2px solid ' + a('.4'),
      anelFraco: '2px solid ' + a('.28'),
      botaoGrad: 'radial-gradient(circle at 50% 32%, ' + mix(0.35) + ' 0%, ' + marca + ' 52%, ' + mix(-0.28) + ' 100%)',
      botaoSombra: '0 22px 54px -14px ' + a('.62') + ', inset 0 -8px 20px rgba(0,0,0,.22), inset 0 6px 16px rgba(255,255,255,.3)'
    };
  }
}
</script>
